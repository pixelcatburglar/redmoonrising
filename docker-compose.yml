name: rmr

services:
  postgres:
    image: postgres:16-alpine
    container_name: rmr-postgres
    environment:
      POSTGRES_USER: rmr
      POSTGRES_PASSWORD: rmr
      POSTGRES_DB: rmr
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Over TCP: during the first-start import postgres only listens on its socket.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "rmr", "-d", "rmr"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5m

  server:
    build: .
    image: rmr-server
    container_name: rmr-server
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      RMR_DATABASE: postgres://rmr:rmr@postgres:5432/rmr
      # Seconds before an accepted alliance application takes effect (24 h).
      RMR_ALLIANCE_JOIN_DELAY: "86400"
      # How many times faster than normal structures anchor, online and unanchor.
      RMR_STARBASE_SPEEDUP: "1"
      # Seconds a tower's claim stands before it counts toward sovereignty (6 days).
      RMR_SOV_CLAIM_DELAY: "518400"
      # How many bot characters the server plays (0: none). Made on the first start.
      RMR_BOTS: "100000"
    ports:
      - "26000:26000"
      # The web dashboard: this machine only, since it has no login.
      - "127.0.0.1:8080:8080"
    init: true
    restart: unless-stopped

volumes:
  pgdata:
